<title>SpeedLimit Project Dossier</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed left "gantry" nav (road-sign panel) + reading column; views switch by hash. */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --fg:#17212b; --muted:#5d6b78; --line:#d9dfe3;
  --asphalt:#24303b; --asphalt-fg:#e9eef2; --signal:#e2a00f; --regulatory:#c4302b; --go:#1d7f62; --info:#2f6db3;
  --code-bg:#eef1f3; --tint:#fbf4e2;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12181e; --surface:#1a222a; --fg:#e4e9ee; --muted:#9aa7b3; --line:#2c3842;
  --asphalt:#0c1116; --asphalt-fg:#dfe6ec; --signal:#f0b429; --regulatory:#ec5a52; --go:#3fb68f; --info:#6aa3e6;
  --code-bg:#222c35; --tint:#2a2414; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12181e; --surface:#1a222a; --fg:#e4e9ee; --muted:#9aa7b3; --line:#2c3842;
  --asphalt:#0c1116; --asphalt-fg:#dfe6ec; --signal:#f0b429; --regulatory:#ec5a52; --go:#3fb68f; --info:#6aa3e6;
  --code-bg:#222c35; --tint:#2a2414; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:16px/1.6 var(--body)}
a{color:var(--info)}
code{font:0.86em var(--mono);background:var(--code-bg);padding:.1em .35em;border-radius:3px}
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
nav.gantry{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;overflow:auto;
  background:var(--asphalt);color:var(--asphalt-fg);padding-block:22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;
  display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:18px;font:600 1.15rem/1.1 var(--display);letter-spacing:.02em;text-transform:uppercase}
.brand i{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:#fff;border:5px solid var(--regulatory);
  color:#111;font:700 .95rem var(--display);font-style:normal}
nav.gantry a{color:inherit;text-decoration:none;padding:7px 10px;border-radius:6px;font-weight:500;display:flex;flex-direction:column;line-height:1.25}
nav.gantry a small{color:#93a3b1;font-size:.74rem;font-weight:400}
nav.gantry a:hover{background:rgba(255,255,255,.07)}
nav.gantry a[aria-current="page"]{background:var(--signal);color:#1b1404}
nav.gantry a[aria-current="page"] small{color:#4a3a10}
.nav-label{margin:16px 10px 4px;font:600 .72rem var(--display);letter-spacing:.14em;text-transform:uppercase;color:#93a3b1}
nav.gantry a:focus-visible,button:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
main{padding-block:36px 80px;padding-left:max(16px,4vw);padding-right:max(16px,env(safe-area-inset-right,0px),4vw);min-width:0}
.eyebrow{font:600 .78rem var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
h1,h2,h3,h4{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:1.6em 0 .5em}
h1{font-size:clamp(2rem,4.2vw,3rem);font-weight:700;margin-top:0}
h2{font-size:1.65rem;font-weight:600}
h3{font-size:1.25rem;font-weight:600}
.lede{font-size:1.1rem;color:var(--muted);max-width:68ch}
.hero{display:flex;gap:28px;align-items:center;flex-wrap:wrap;margin-bottom:28px}
.sign{flex:none;width:118px;height:118px;border-radius:50%;background:#fff;border:14px solid var(--regulatory);display:grid;place-items:center;
  box-shadow:0 0 0 3px #fff,0 6px 18px rgba(0,0,0,.18)}
.sign span{font:700 2.9rem/1 var(--display);color:#111}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column}
.tile b{font:700 1.9rem/1.1 var(--display);font-variant-numeric:tabular-nums}
.tile span{font-weight:600}
.tile small{color:var(--muted)}
.sec{margin-top:2.2em}
.sec-sub{color:var(--muted);margin-top:-.3em}
.findings{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.finding{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--muted);border-radius:8px;
  padding:14px;display:flex;flex-direction:column;gap:6px}
.finding:hover{border-color:var(--signal)}
.finding:focus-visible{outline:3px solid var(--signal)}
.sev-critical{border-top-color:var(--regulatory)} .sev-major{border-top-color:var(--signal)} .sev-minor{border-top-color:var(--info)}
.sev{font:600 .72rem var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.finding img{border-radius:4px;border:1px solid var(--line);aspect-ratio:16/9;object-fit:cover;object-position:top;width:100%;background:#fff}
.ft{font:600 1.2rem/1.2 var(--display)}
.fd{color:var(--muted);font-size:.95rem}
.fref{font:500 .78rem var(--mono);color:var(--info)}
.dcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;text-decoration:none;color:var(--fg);display:flex;flex-direction:column}
.dcard:hover{border-color:var(--signal)}
.dcard b{font:600 1.1rem var(--display)}
.persp{font:600 .7rem var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
pre.mermaid{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;overflow-x:auto;text-align:center}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr));gap:18px}
.gcard{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.zoom{all:unset;cursor:zoom-in;background:#fff;display:block}
.zoom img{display:block;width:100%}
.gcard figcaption{padding:12px 14px;display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--line)}
.gcard b{font:600 1.15rem var(--display)}
.gcard figcaption span:not(.fid){color:var(--muted);font-size:.95rem}
.gcard code{align-self:flex-start;font-size:.75rem}
.fid{font:600 .75rem var(--mono);color:#1b1404;background:var(--signal);padding:1px 6px;border-radius:3px;align-self:flex-start}
.doc-head{display:flex;gap:14px;flex-wrap:wrap;align-items:baseline;margin-bottom:8px}
.doc-head .src{font:.78rem var(--mono);color:var(--muted)}
.doc-grid{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:36px;align-items:start}
.prose{min-width:0;max-width:880px}
.prose > h1:first-child{margin-top:0}
.prose p,.prose li{max-width:75ch}
.prose blockquote{margin:1em 0;padding:10px 16px;background:var(--tint);border-left:4px solid var(--signal);border-radius:0 6px 6px 0}
.prose pre:not(.mermaid){background:var(--code-bg);padding:12px 14px;border-radius:6px;overflow-x:auto;font:.84rem/1.5 var(--mono)}
.prose pre code{background:none;padding:0}
.tw{overflow-x:auto;margin:1em 0;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.92rem;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--code-bg);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:none}
.docfig{margin:1.2em 0;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.docfig img{display:block;width:100%;background:#fff}
.docfig figcaption{padding:8px 12px;font-size:.85rem;color:var(--muted);border-top:1px solid var(--line)}
.docfig.narrow{max-width:640px}
.box{display:inline-block;width:.9em;height:.9em;border:1.5px solid var(--muted);border-radius:3px;vertical-align:-.1em;margin-right:.3em}
.toc{position:sticky;top:20px;font-size:.88rem;border-left:2px solid var(--line);padding-left:14px;max-height:calc(100vh - 40px);overflow:auto}
.toc-label{font:600 .72rem var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.toc ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.toc button{all:unset;cursor:pointer;color:var(--muted);line-height:1.3;padding:3px 0;display:block}
.toc button:hover{color:var(--fg)}
.lightbox{position:fixed;inset:0;background:rgba(10,14,18,.88);display:grid;place-items:center;z-index:50;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;background:#fff;border-radius:6px}
@media (max-width:1100px){.doc-grid{grid-template-columns:minmax(0,1fr)}.toc{display:none}}
@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr)}
  nav.gantry{position:static;height:auto;flex-direction:row;flex-wrap:wrap;gap:4px;padding-right:max(16px,env(safe-area-inset-right,0px))}
  .brand{width:100%;margin-bottom:6px}
  .nav-label{display:none}
  nav.gantry a small{display:none}
  nav.gantry a{padding:5px 9px;font-size:.88rem}
  .sign{width:84px;height:84px;border-width:10px}.sign span{font-size:2rem}
}
@media (prefers-reduced-motion:no-preference){.view{animation:in .18s ease-out}@keyframes in{from{opacity:.6}to{opacity:1}}}
</style>
<div class="shell">
  <nav class="gantry" aria-label="Dossier">
    <div class="brand"><i>80</i>SpeedLimit<br>Dossier</div>
    {{NAV}}
  </nav>
  <main id="main">
    {{VIEWS}}
  </main>
</div>
<div class="lightbox" id="lb" hidden><img alt="Enlarged figure" id="lbimg"></div>
<script>
(function(){
  const views=[...document.querySelectorAll('.view')];
  const names=new Set(views.map(v=>v.dataset.view));
  function show(){
    let h=(location.hash||'').slice(1); if(!names.has(h)) h='overview';
    views.forEach(v=>v.hidden=v.dataset.view!==h);
    document.querySelectorAll('[data-nav]').forEach(a=>{ if(a.dataset.nav===h) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
    window.scrollTo(0,0);
  }
  addEventListener('hashchange',show); show();
  document.addEventListener('click',e=>{
    const j=e.target.closest('[data-jump]'); if(j){const v=j.closest('.view');const t=v&&v.querySelector('[id="'+v.dataset.view+'--'+j.dataset.jump+'"]');if(t)t.scrollIntoView({behavior:'smooth',block:'start'});return;}
    const f=e.target.closest('[data-fig]'); if(f){location.hash='evidence';setTimeout(()=>{const g=document.getElementById('g-'+f.dataset.fig);if(g)g.scrollIntoView({block:'start'});},30);return;}
    const z=e.target.closest('.zoom, .docfig img'); if(z){const src=z.dataset.src||z.getAttribute('src');document.getElementById('lbimg').src=src;document.getElementById('lb').hidden=false;return;}
    if(e.target.closest('#lb')) document.getElementById('lb').hidden=true;
  });
  addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('lb').hidden=true;});
})();
</script>
